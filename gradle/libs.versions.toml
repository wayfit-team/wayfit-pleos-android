[versions]
agp = "8.11.2"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
zxing = "3.5.3"
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"
pleosFusedLocation = "1.1.3"
pleosTts = "3.3.1"
pleosStt = "3.3.1"
ksp = "2.0.21-1.0.27"
