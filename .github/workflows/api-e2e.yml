name: API E2E

# 차량 앱이 쓰는 백엔드 API 를 앱과 같은 순서·본문으로 호출해 본다 (scripts/api_e2e.py).
# 실제 서버에 테스트 기기·방문·쿠폰이 남으므로 자동 실행하지 않고 Actions 탭에서 수동으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      api:
        description: 백엔드 주소
        default: https://wayfit-backend.dannyldj.workers.dev
        required: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: API E2E
        env:
          WAYFIT_API: ${{ inputs.api }}
        run: python3 scripts/api_e2e.py
