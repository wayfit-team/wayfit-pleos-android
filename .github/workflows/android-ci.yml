name: Android CI

# PR·develop 푸시마다 단위 테스트와 debug 빌드를 돌린다.
# Pleos Playground 키는 쓰지 않는다 (비어 있으면 TTS·STT 가 온디바이스로만 동작하도록 빌드됨)
on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: 단위 테스트
        run: ./gradlew :automotive:testDebugUnitTest

      - name: debug 빌드
        run: ./gradlew :automotive:assembleDebug

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: automotive/build/reports/tests/testDebugUnitTest
